<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 290px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #fff;
    }

    /* En-tête */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo {
      width: 20px;
      height: 20px;
      background: #6366f1;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 13px;
      font-weight: 600;
      color: #333;
      letter-spacing: -0.01em;
    }

    /* Titre de la page */
    #page-title {
      font-size: 12px;
      color: #555;
      line-height: 1.4;
      max-height: 2.8em;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      margin-bottom: 12px;
      padding: 8px;
      background: #f8f8f8;
      border-radius: 6px;
    }

    /* Bouton */
    #btn-save {
      width: 100%;
      padding: 9px 0;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    #btn-save:hover:not(:disabled) { background: #4f46e5; }
    #btn-save:disabled {
      background: #a5b4fc;
      cursor: not-allowed;
    }

    /* Indicateur de compatibilité */
    #compat-indicator {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 8px;
      background: #f5f5f5;
      border-radius: 5px;
      margin-bottom: 12px;
    }
    .compat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .compat-dot.checking     { background: #9ca3af; }
    .compat-dot.ok           { background: #16a34a; }
    .compat-dot.partial      { background: #d97706; }
    .compat-dot.incompatible { background: #dc2626; }
    #compat-label { font-size: 12px; color: #444; line-height: 1.3; }

    /* Zone de statut */
    #status {
      display: none;
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.45;
      word-break: break-word;
    }
    #status.info    { display: block; background: #f0f9ff; color: #0369a1; }
    #status.success { display: block; background: #f0fdf4; color: #15803d; }
    #status.error   { display: block; background: #fef2f2; color: #dc2626; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"></div>
    <h1>Save &amp; Resurface</h1>
  </div>

  <div id="page-title">Chargement…</div>

  <div id="compat-indicator">
    <span class="compat-dot checking" id="compat-dot"></span>
    <span id="compat-label">Analyse de la page…</span>
  </div>

  <button id="btn-save" disabled>Sauvegarder</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
